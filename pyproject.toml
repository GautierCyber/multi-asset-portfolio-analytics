[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-portfolio-analytics"
version = "0.1.0"
description = "Multi-asset portfolio construction, backtesting and risk analytics project."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=2.3.5,<3.0",
    "pandas>=3.0.5,<4.0",
    "yfinance>=1.5.2,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]